[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-game-spoof"
version = "0.1.0"
description = "show fake games on discord via fake processes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
discord-fake-process = "discord_game_spoof.process_spoof:main"

[tool.setuptools.packages.find]
where = ["src"]